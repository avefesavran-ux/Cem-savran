/* ─── HOOKS ─── */
function useReveal(threshold = 0.12) {
  const ref = useRef(null);
  const [v, setV] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setV(true); obs.unobserve(el); } }, { threshold });
    obs.observe(el);
    return () => obs.disconnect();
  }, [threshold]);
  return [ref, v];
}

function useScrollProgress() {
  const [p, setP] = useState(0);
  useEffect(() => {
    const h = () => { const t = document.documentElement.scrollHeight - window.innerHeight; setP(t > 0 ? Math.min(window.scrollY / t, 1) : 0); };
    window.addEventListener("scroll", h, { passive: true });
    return () => window.removeEventListener("scroll", h);
  }, []);
  return p;
}

function Counter({ end, duration = 2000, suffix = "", visible }) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    if (!visible) return;
    let s = 0;
    const step = (ts) => { if (!s) s = ts; const p = Math.min((ts - s) / duration, 1); setVal(Math.floor(p * end)); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }, [visible, end, duration]);
  return <span>{val}{suffix}</span>;
}

function Typewriter({ text, speed = 30, visible }) {
  const [d, setD] = useState("");
  useEffect(() => {
    if (!visible) return;
    let i = 0;
    const iv = setInterval(() => { i++; setD(text.slice(0, i)); if (i >= text.length) clearInterval(iv); }, speed);
    return () => clearInterval(iv);
  }, [visible, text, speed]);
  return <span>{d}<span style={{ opacity: d.length < text.length ? 1 : 0, color: GOLD }}>▎</span></span>;
}

function MagButton({ children, style, onClick }) {
  const ref = useRef(null);
  const [o, setO] = useState({ x: 0, y: 0 });
  return (
    <button ref={ref} onClick={onClick}
      onMouseMove={e => { const r = ref.current.getBoundingClientRect(); setO({ x: (e.clientX - r.left - r.width/2) * 0.18, y: (e.clientY - r.top - r.height/2) * 0.18 }); }}
      onMouseLeave={() => setO({ x: 0, y: 0 })}
      style={{ ...style, transform: `translate(${o.x}px,${o.y}px)`, transition: "transform 0.4s cubic-bezier(0.23,1,0.32,1), background 0.4s, border-color 0.4s, color 0.4s" }}>
      {children}
    </button>
  );
}

function LineDraw({ width = 80, visible, delay = 0, color = B }) {

function Fleuron({ size = 14, color = GOLD }) {

function Signature({ visible }) {

function ScrollProgress() {

}

        .social-arrow{color:${MU};font-size:16px;transition:transform 0.3s,color 0.3s}
        .social-link:hover .social-arrow{transform:translateX(6px);color:${GOLD}}

        .scroll-line{width:1px;height:36px;background:linear-gradient(to bottom,${GOLD}60,transparent);animation:scrollPulse 2.4s ease-in-out infinite}
        @keyframes scrollPulse{0%,100%{opacity:0.4;transform:scaleY(1)}50%{opacity:1;transform:scaleY(1.4)}}

        /* ═══════ ECINNI COSMIC PAGE ═══════ */
        .cosmos-bg{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
        .starfield-bg{position:absolute;inset:0}
        .star-bg{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--dur,3s) ease-in-out infinite alternate}
        @keyframes twinkle{0%{opacity:0.05;transform:scale(0.6)}100%{opacity:var(--max-o,0.7);transform:scale(1.4)}}
        .nebula{position:absolute;border-radius:50%;filter:blur(80px);mix-blend-mode:screen;transition:transform 0.6s ease-out}
        .nebula-burgundy{width:700px;height:700px;background:radial-gradient(circle,${B}33,transparent 70%);top:-10%;right:-15%;animation:drift 25s ease-in-out infinite alternate}
        .nebula-gold{width:600px;height:600px;background:radial-gradient(circle,${GOLD}1f,transparent 70%);bottom:-10%;left:-10%;animation:drift 30s ease-in-out infinite alternate-reverse}
        .nebula-deep{width:500px;height:500px;background:radial-gradient(circle,${BD}55,transparent 70%);top:40%;left:50%;animation:drift 35s ease-in-out infinite alternate}
        @keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(80px,-60px) scale(1.15)}}

        .orbit-stage{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(900px,95vw);height:min(900px,95vw);pointer-events:none}
        .orbit{position:absolute;top:50%;left:50%;border-radius:50%;border:1px solid ${GOLD}20;transform:translate(-50%,-50%)}
        .orbit-1{width:100%;height:100%;animation:spin 60s linear infinite}
        .orbit-2{width:75%;height:75%;border-color:${GOLD}28;animation:spin 45s linear infinite reverse}
        .orbit-3{width:50%;height:50%;border-color:${GOLD}14;animation:spin 30s linear infinite}
        .orbit-1::before,.orbit-2::before,.orbit-3::before{content:'';position:absolute;width:6px;height:6px;background:${GOLD};border-radius:50%;box-shadow:0 0 20px ${GOLD}}
        .orbit-1::before{top:-3px;left:30%}
        .orbit-2::before{bottom:-3px;right:25%;background:${B};box-shadow:0 0 20px ${B}}
        .orbit-3::before{top:50%;left:-3px}
        @keyframes spin{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}

        .ec-kicker{display:flex;align-items:center;gap:20px;justify-content:center;position:relative;z-index:2}
        .kicker-line{width:60px;height:1px;background:linear-gradient(90deg,transparent,${GOLD})}
        .kicker-line.right{background:linear-gradient(90deg,${GOLD},transparent)}

        .ec-title{font-family:${F};font-style:italic;font-weight:700;font-size:clamp(80px,18vw,200px);line-height:0.85;letter-spacing:-0.02em;text-align:center;position:relative;z-index:2;margin:0}
        .ec-title-bg{background:linear-gradient(180deg,${CR} 0%,${GOLD_LIGHT} 60%,${GOLD} 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 80px ${GOLD}30);position:relative;display:inline-block}
        .title-accent{position:absolute;color:${GOLD};font-size:0.2em;font-style:normal;-webkit-text-fill-color:${GOLD};animation:pulse 3s ease-in-out infinite}
        .title-accent.left{top:20%;left:-8%}
        .title-accent.right{bottom:25%;right:-8%;animation-delay:1.5s}
        @keyframes pulse{0%,100%{opacity:0.4;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}

        .ec-ornament{display:flex;align-items:center;justify-content:center;gap:30px;padding:60px 20px;max-width:600px;margin:0 auto}
        .div-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,${GOLD}33,transparent)}
        .div-mark{font-family:${F};color:${GOLD};font-size:24px;letter-spacing:8px}

        .ec-section{padding:80px 20px;max-width:1100px;margin:0 auto}
        .ec-eyebrow{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:60px}
        .eb-num{font-family:${F};font-style:italic;font-size:16px;color:${GOLD};letter-spacing:4px}
        .eb-line{width:40px;height:1px;background:${GOLD}}
        .eb-text{font-family:${F};font-size:12px;letter-spacing:8px;color:${CR}}

        .syn-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:start}
        .syn-block{font-family:${F};font-size:clamp(17px,1.6vw,19px);line-height:1.95;color:${CR}aa}
        .syn-block p{margin-bottom:1.5em}
        .syn-block p:last-child{margin-bottom:0}
        .dropcap::first-letter{font-family:${F};font-style:italic;font-size:4em;color:${GOLD};float:left;line-height:0.85;margin:0.05em 0.1em 0 0;font-weight:700}
        .hl{color:${GOLD_LIGHT};font-style:italic;font-weight:500}

        .ec-cosmic{padding:100px 20px}
        .cosmic-inner{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
        .planet-stage{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
        .planet{width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 30%,${GOLD_LIGHT} 0%,${GOLD} 30%,${GOLD_DEEP} 60%,${BD} 100%);box-shadow:inset -30px -30px 80px rgba(0,0,0,0.5),0 0 100px ${GOLD}30,0 0 200px ${GOLD}15;position:relative;animation:planetSpin 40s linear infinite}
        .planet::before{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 70% 70%,transparent 50%,rgba(0,0,0,0.4) 100%)}
        @keyframes planetSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
        .planet-orbit{position:absolute;inset:-10%;border:1px dashed ${GOLD}40;border-radius:50%;animation:planetSpin 25s linear infinite}
        .planet-orbit::before{content:'';position:absolute;width:12px;height:12px;background:${CR};border-radius:50%;top:-6px;left:50%;box-shadow:0 0 20px ${CR}}
        .planet-label{position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);font-family:${F};font-style:italic;font-size:14px;letter-spacing:6px;color:${GOLD};white-space:nowrap}
        .cosmic-text h2{font-family:${F};font-style:italic;font-weight:600;font-size:clamp(28px,4vw,42px);line-height:1.2;color:${CR};margin-bottom:24px}
        .cosmic-text h2 em{color:${GOLD};font-style:italic}
        .cosmic-text p{font-family:${F};font-size:clamp(17px,1.5vw,19px);line-height:1.85;color:${CR}aa;margin-bottom:1.2em}
        .cosmic-list{list-style:none;margin-top:30px}
        .cosmic-list li{font-family:${F};font-style:italic;font-size:17px;color:${CR};padding:14px 0;border-top:1px solid ${GOLD}25;display:flex;align-items:center;gap:16px;transition:padding-left 0.4s,color 0.4s}
        .cosmic-list li:hover{padding-left:10px;color:${GOLD_LIGHT}}
        .cosmic-list li:last-child{border-bottom:1px solid ${GOLD}25}
        .cosmic-list li::before{content:'◇';color:${GOLD};font-size:0.7em}

        .char-row{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:50px}
        .char{text-align:center;padding:30px 16px;transition:all 0.6s cubic-bezier(0.16,1,0.3,1)}
        .char-icon-wrap{width:90px;height:90px;margin:0 auto 30px;display:flex;align-items:center;justify-content:center;position:relative;border-radius:50%;border:1px solid ${GOLD}33;transition:all 0.5s ease}
        .char-icon-wrap::before{content:'';position:absolute;inset:-10px;border-radius:50%;border:1px solid ${GOLD}15;transition:all 0.5s ease}
        .char:hover .char-icon-wrap{border-color:${GOLD};box-shadow:0 0 30px ${GOLD}30}
        .char:hover .char-icon-wrap::before{inset:-16px;border-color:${GOLD}33}
        .char-icon-wrap svg{width:38px;height:38px;stroke:${GOLD};fill:none;stroke-width:1.2;transition:all 0.5s ease}
        .char:hover .char-icon-wrap svg{stroke:${GOLD_LIGHT};transform:scale(1.1)}
        .char-name{font-family:${F};font-style:italic;font-weight:700;font-size:28px;color:${CR};margin-bottom:8px;letter-spacing:1px}
        .char-role{font-family:${F};font-size:11px;letter-spacing:5px;color:${GOLD};margin-bottom:18px}
        .char-desc{font-family:${F};font-style:italic;font-size:16px;line-height:1.7;color:${CR}aa;max-width:280px;margin:0 auto}

        .themes-grid{display:flex;justify-content:center;flex-wrap:wrap;max-width:900px;margin:0 auto;border-top:1px solid ${GOLD}25;border-left:1px solid ${GOLD}25}
        .theme-cell-ec{flex:1 0 33.333%;min-width:200px;padding:30px 20px;border-right:1px solid ${GOLD}25;border-bottom:1px solid ${GOLD}25;font-family:${F};font-style:italic;font-size:18px;color:${CR};transition:all 0.4s ease}
        .theme-cell-ec:hover{background:${GOLD}10;color:${GOLD_LIGHT}}
        .theme-cell-ec .num{display:block;font-family:${F};font-size:11px;color:${GOLD};letter-spacing:3px;margin-bottom:6px;font-style:normal}

        .ec-quote{padding:120px 20px;text-align:center;position:relative}
        .ec-quote-stage{max-width:800px;margin:0 auto;position:relative}
        .ec-quote-mark{font-family:${F};font-style:italic;font-size:180px;line-height:0.8;color:${GOLD};opacity:0.2;position:absolute;top:-40px;left:50%;transform:translateX(-50%)}
        .ec-quote-body{font-family:${F};font-style:italic;font-size:clamp(24px,3.5vw,38px);line-height:1.5;color:${CR};position:relative;z-index:2}
        .ec-quote-body em{color:${GOLD_LIGHT};font-style:italic}
        .ec-quote-attr{margin-top:40px;font-family:${F};font-size:13px;letter-spacing:6px;color:${GOLD}}

        .ec-finale{padding:80px 20px 60px;text-align:center}
        .finale-frame{max-width:700px;margin:0 auto;padding:80px 40px;position:relative}
        .finale-frame::before,.finale-frame::after{content:'';position:absolute;width:40px;height:40px;border:1px solid ${GOLD}}
        .finale-frame::before{top:0;left:0;border-right:none;border-bottom:none}
        .finale-frame::after{bottom:0;right:0;border-left:none;border-top:none}
        .finale-frame .finale-corner-tr,.finale-frame .finale-corner-bl{position:absolute;width:40px;height:40px;border:1px solid ${GOLD}}
        .finale-author{font-family:${F};font-style:italic;font-size:clamp(20px,2.5vw,26px);letter-spacing:8px;color:${CR};margin-bottom:24px}
        .finale-title{font-family:${F};font-style:italic;font-weight:900;font-size:clamp(56px,9vw,96px);line-height:0.9;background:linear-gradient(180deg,${CR},${GOLD});-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:24px;filter:drop-shadow(0 0 60px ${GOLD}30)}
        .finale-tag{font-family:${F};font-size:13px;letter-spacing:6px;color:${GOLD};margin-bottom:50px}
        .finale-cta{display:inline-flex;align-items:center;gap:14px;font-family:${F};font-size:14px;letter-spacing:5px;color:${CR};background:transparent;border:1px solid ${GOLD};padding:18px 40px;text-decoration:none;cursor:pointer;transition:all 0.4s ease;position:relative;overflow:hidden}
        .finale-cta::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,${GOLD}33,transparent);transition:left 0.6s ease}
        .finale-cta:hover::before{left:100%}
        .finale-cta:hover{background:${GOLD}10;color:${GOLD_LIGHT};letter-spacing:6px}
        .finale-cta-arrow{display:inline-block;transition:transform 0.4s ease}
        .finale-cta:hover .finale-cta-arrow{transform:translateX(6px)}

        @media(max-width:900px){
          .syn-grid,.cosmic-inner{grid-template-columns:1fr;gap:50px}
          .planet-stage{max-width:300px;margin:0 auto}
          .char-row{grid-template-columns:1fr;gap:30px}
        }
        @media(max-width:600px){
          .theme-cell-ec{flex:1 0 50%;min-width:0;font-size:15px;padding:22px 12px}
          .finale-frame{padding:50px 24px}
          .ec-quote-mark{font-size:120px}
        }
        @media(max-width:768px){
          .desktop-nav{display:none!important}
          .mobile-menu-btn{display:flex!important}
        }
        @media(min-width:769px){
          .mobile-menu-btn{display:none!important}
        }
      `}</style>
      <TexturedBg />
      <ScrollProgress />
      <Navbar currentPage={currentPage} setCurrentPage={setCurrentPage} />
      <div key={pageKey} className="page-anim">{renderPage()}</div>
      <Footer />
    </>
  );
}


        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
